<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/invite.css">
  <script src="/invite.js" defer></script>
  <title>Harbor Music invitation</title>
</head>
<body>
  <main>
    <h1>Harbor Music invitation</h1>
    <p>Open this invite in your own Harbor to send your friend an approval request.</p>
    <form id="open-harbor">
      <label for="address">Your Harbor address</label>
      <input type="url" id="address" placeholder="https://your-harbor…" autocomplete="url" required>
      <button type="submit">Open in my Harbor</button>
    </form>
    <p id="message" role="status"></p>
  </main>
</body>
</html>
